name = "bingekeeper"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./src/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bingekeeper-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
crons = ["0 10 * * *"]

[vars]
# Set these as secrets in Cloudflare dashboard:
# TMDB_API_KEY, JWT_SECRET, RESEND_API_KEY
