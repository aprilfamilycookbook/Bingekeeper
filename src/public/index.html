<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingekeeper — Track Your Shows</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-box">
      <div class="auth-logo">📺 Binge<span>keeper</span></div>
      <p class="auth-tagline">Track your shows. Never miss a new season.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab" onclick="showTab('login')">Sign in</button>
        <button class="auth-tab" id="registerTab" onclick="showTab('register')">Create account</button>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="loginError" class="auth-error hidden"></div>
        <button class="btn-auth" onclick="doLogin()">Sign in</button>
      </div>

      <div id="registerForm" class="hidden">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password <span class="hint">(6+ characters)</span></label>
          <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="regNotify" checked>
            Email me when new seasons/episodes drop
          </label>
        </div>
        <div id="registerError" class="auth-error hidden"></div>
        <button class="btn-auth" onclick="doRegister()">Create account</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="hidden">
    <header>
      <div class="header-inner">
        <div class="logo">📺 Binge<span>keeper</span></div>
        <div class="header-right">
          <span id="userEmail" class="user-email"></span>
          <button class="btn-ghost" onclick="doLogout()">Sign out</button>
        </div>
      </div>
    </header>

    <main>
      <div class="search-section">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search for a TV show to add..." autocomplete="off">
          <button class="btn-primary" id="searchBtn" onclick="doSearch()">Search</button>
        </div>
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div class="list-section">
        <div class="tabs" id="tabs"></div>
        <div id="showsGrid" class="shows-grid"></div>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/app.js"></script>
</body>
</html>
