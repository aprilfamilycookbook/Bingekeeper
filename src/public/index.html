<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingekeeper</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
        Binge<span>keeper</span>
      </div>
      <div class="header-actions">
        <span id="showCount" class="show-count"></span>
        <button class="btn-icon" id="themeToggle" aria-label="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section class="search-section">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search for a TV show..." autocomplete="off" />
        <button id="searchBtn" class="btn-primary">Search</button>
      </div>
      <div id="searchResults" class="search-results hidden"></div>
    </section>
    <section class="list-section">
      <div class="tabs" id="tabs"></div>
      <div id="showsGrid" class="shows-grid"></div>
    </section>
  </main>
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="btn-icon" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/js/app.js"></script>
</body>
</html>
